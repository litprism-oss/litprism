[project]
name = "litprism-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "celery>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "litprism-pubmed",
    "litprism-europepmc",
    "litprism-semanticscholar",
    "litprism-crossref",
    "litprism-screen",
    "rispy>=0.9",
    "bibtexparser>=2.0.0b7",
    "pymupdf>=1.24",
    "rapidfuzz>=3.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "pytest-mock>=3.14",
]

[tool.uv.sources]
litprism-pubmed = { workspace = true }
litprism-europepmc = { workspace = true }
litprism-semanticscholar = { workspace = true }
litprism-crossref = { workspace = true }
litprism-screen = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires network and real API keys (skipped in CI)"]
addopts = "-m 'not integration'"
pythonpath = ["backend"]
