name: Benchmark screening

# Manual only. Screens a labelled dataset with the configured LLM and prints recall,
# precision and work saved in the run summary. Uses the same GEMINI_API_KEY secret as the
# deploy. Costs API calls: keep `limit` small for a first run.
on:
  workflow_dispatch:
    inputs:
      dataset_url:
        description: Leave empty to use the Wilson-disease sample (real records). Or a raw CSV URL with title, abstract and a label column (label, label_included, included)
        default: ""
      criteria_json:
        description: 'Leave empty for the sample criteria. Or JSON: {"inclusion": [...], "exclusion": [...]}'
        default: ""
      limit:
        description: Screen a random sample of N records (all relevant ones are kept). 0 = everything
        default: "0"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --package litprism-screen
      - name: Get dataset
        env:
          DATASET_URL: ${{ inputs.dataset_url }}
        run: |
          if [[ -n "$DATASET_URL" ]]; then
            curl -fsSL "$DATASET_URL" -o data.csv
          else
            cp apps/litprism-app/frontend/public/samples/records.csv data.csv
          fi
      - name: Run benchmark
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          CRITERIA: ${{ inputs.criteria_json }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [[ -n "$CRITERIA" ]]; then printf '%s' "$CRITERIA" > criteria.json
          else cp apps/litprism-app/frontend/public/samples/criteria.json criteria.json; fi
          args=(data.csv criteria.json)
          if [[ "$LIMIT" != "0" ]]; then args+=(--limit "$LIMIT"); fi
          uv run --package litprism-screen python -m litprism.screen.benchmark "${args[@]}" | tee bench.log
          { echo '### Screening benchmark'; echo "Dataset: ${{ inputs.dataset_url || 'Wilson-disease sample (150 real records)' }}"; echo '```'; cat bench.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
